<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Convite Especial 🍒</title>

  <!-- Preview WhatsApp / Instagram / Facebook -->
  <meta property="og:title" content="Convite Especial 🍒" />
  <meta property="og:description" content="Convido você a comemorar comigo este momento incrível! 🍒" />
  <meta property="og:image" content="https://ysmmcf.github.io/ConviteFesta/Capalinacerto.png" />
  <meta property="og:url" content="https://ysmmcf.github.io/ConviteFesta/convite-lina.html" />
  <meta property="og:type" content="website" />

  <!-- Twitter Preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Convite Especial 🍒" />
  <meta name="twitter:description" content="Convido você a comemorar comigo este momento incrível! 🍒" />
  <meta name="twitter:image" content="https://ysmmcf.github.io/ConviteFesta/Capalina.png" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .convite-container {
      position: relative;
      width: 100%;
      max-width: 430px;
    }

    .convite-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* BOTÕES INVISÍVEIS */
    .btn-invisivel {
      position: absolute;
      width: 26%;
      height: 11%;
      background: rgba(255, 0, 0, 0);
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    #btn-localizacao { left: 6%; top: 77%; }
    #btn-oquelevar   { left: 37%; top: 77%; }
    #btn-dresscode   { left: 68%; top: 77%; }

    /* BOTÃO "!" */
    .btn-info {
      position: absolute;
      top: 2%;
      right: 3%;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #891E0D;
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }

    /* POPUP */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
      box-sizing: border-box;
    }

    .modal-content {
      position: relative;
      width: 85%;
      max-width: 320px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.4);
      animation: popup 0.25s ease forwards;
      background: white;
    }

    @keyframes popup {
      from {
        transform: scale(0.85);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-content img {
      width: 100%;
      display: block;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #891E0D;
      color: white;
      border: none;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      z-index: 10;
    }

    /* CAPA SEM BORDA */
    .capa {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
      transition: opacity 1s ease;
      padding: 0;
      margin: 0;
    }

    .capa img {
      width: 100%;
      max-width: 430px;
      height: auto;
      display: block;
    }

    /* TEXTO CLIQUE PARA ENTRAR */
    .texto-clique {
      position: absolute;
      bottom: 6%;
      width: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #891E0D;
      text-shadow: 0px 2px 6px rgba(0,0,0,0.2);
      animation: piscar 1.2s infinite;
    }

    @keyframes piscar {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .capa.fadeout {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- CAPA -->
  <div class="capa" id="capa">
    <img src="https://ysmmcf.github.io/ConviteFesta/Lina1.png" alt="Capa Convite" />
    <div class="texto-clique">Clique para entrar</div>
  </div>

  <!-- CONVITE -->
  <div class="convite-container">

    <button class="btn-info" id="btnInfo">!</button>

    <img src="https://ysmmcf.github.io/ConviteFesta/Lina_20260519_222517_0000.png.png" alt="Convite" />

    <button class="btn-invisivel" id="btn-localizacao"></button>
    <button class="btn-invisivel" id="btn-oquelevar"></button>
    <button class="btn-invisivel" id="btn-dresscode"></button>

  </div>

  <!-- Modal popup -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">X</button>
      <img src="https://ysmmcf.github.io/ConviteFesta/Popup.png" alt="Popup" />
    </div>
  </div>

  <script>
    document.getElementById("btn-localizacao").onclick = () => {
      window.open("https://maps.app.goo.gl/8ySoep8RzN42ye2b8?g_st=ac", "_blank");
    };

    document.getElementById("btn-oquelevar").onclick = () => {
      window.open("https://ysmmcf.github.io/ConviteFesta/Linaoquelevar.png", "_blank");
    };

    document.getElementById("btn-dresscode").onclick = () => {
      window.open("https://ysmmcf.github.io/ConviteFesta/Lina_20260519_222517_0001.png.png", "_blank");
    };

    const modal = document.getElementById("modal");
    const btnInfo = document.getElementById("btnInfo");
    const closeModal = document.getElementById("closeModal");

    btnInfo.onclick = () => {
      modal.style.display = "flex";
    };

    closeModal.onclick = () => {
      modal.style.display = "none";
    };

    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    };

    const capa = document.getElementById("capa");

    capa.onclick = () => {
      capa.classList.add("fadeout");

      setTimeout(() => {
        capa.style.display = "none";
      }, 1000);
    };
  </script>

</body>
</html>
