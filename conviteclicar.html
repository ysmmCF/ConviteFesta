<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Convite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonte Amatic SC -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  overflow-y: auto;
  font-family: 'Amatic SC', cursive;
}

/* ===== CONVITE ===== */
#convite {
  width: 100%;
  display: flex;
  justify-content: center;
}

#conteudo {
  width: 100%;
  position: relative;
}

#conteudo img {
  width: 100%;
  height: auto;
  display: block;
}

/* Área dos botões */
#botoes {
  position: absolute;
  top: 76%;
  left: 62%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 22px;
  width: 85%;
  max-width: 340px;
  z-index: 15; /* garante que fique acima do pop-up */
}

.botao {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: white;
  font-size: 26px;
  letter-spacing: 1px;
  font-family: 'Amatic SC', cursive;
}

/* Bolinha azul */
.icone {
  width: 57px;
  height: 57px;
  background: #719aff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Ícone branco */
.icone .material-icons {
  color: white;
  font-size: 28px;
  font-family: 'Material Icons'; /* força o Material Icons */
  font-style: normal;
  font-weight: normal;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}

/* Vídeo posicionado */
#video-container {
  position: absolute;
  top: 46%;
  left: 51%;
  transform: translateX(-50%);
  width: 289px;
  cursor: pointer;
  z-index: 10;
}

#video-container video {
  width: 100%;
  display: block;
  border-radius: 12px;
  background: transparent;
}

/* ===== POP-UP ===== */
#popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5); /* fundo semitransparente */
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 20;
}

#popup.active {
  opacity: 1;
  pointer-events: all;
}

#popup-content {
  background: #223052;
  color: white;
  padding: 35px 40px;
  border-radius: 20px;
  text-align: center;
  max-width: 400px;
  width: 95%;
  box-shadow: 0 6px 25px rgba(0,0,0,0.7);
  position: relative;
  font-size: 28px;
}

/* Botão de fechar */
#popup-close {
  position: absolute;
  top: 10px;
  right: 14px;
  cursor: pointer;
  font-size: 34px;
  color: white;
}

</style>
</head>

<body>

<div id="convite">
  <div id="conteudo">

    <!-- Fundo -->
    <img   
      src="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/C%C3%B3pia%20de%20Rhuana_20260212_034823_0000.png"  
      alt="Convite Rhuana"
    >

    <!-- Vídeo -->
    <div id="video-container">
      <video id="video" preload="metadata">
        <source src="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/lv_0_20260212034450.mp4" type="video/mp4">
        Seu navegador não suporta vídeo.
      </video>
    </div>

    <!-- Botões -->
    <div id="botoes">

      <a href="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/sugest%C3%A3o%20de%20presente%20rhuana.jpeg" class="botao">
        <div class="icone">
          <span class="material-icons">card_giftcard</span>
        </div>
        Sugestões de presentes
      </a>

      <a href="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/paleta%20de%20cores%20rhuana.jpeg" class="botao">
        <div class="icone">
          <span class="material-icons">checkroom</span>
        </div>
        Dress code
      </a>

      <a href="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/C%C3%B3pia%20de%20Rhuana.png" class="botao">
        <div class="icone">
          <span class="material-icons">menu_book</span>
        </div>
        Manual do convidado
      </a>

      <a href="https://maps.app.goo.gl/7bjk6MGksNM6erDX8" class="botao">
        <div class="icone">
          <span class="material-icons">place</span>
        </div>
        Localização
      </a>

    </div>

  </div>
</div>

<!-- POP-UP -->
<div id="popup">
  <div id="popup-content">
    <div id="popup-close">&times;</div>
    <p>O convite é interativo, se sinta à vontade para clicar nos botões e no envelope!</p>
  </div>
</div>

<!-- Música -->
<audio id="music">
  <source src="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/frozen%20m%C3%BAsica.mp4" type="audio/mp4">
</audio>

<script>
const video = document.getElementById("video");
const music = document.getElementById("music");

// Mostrar primeiro frame
video.pause();
video.currentTime = 0;

// Tocar vídeo e música ao clicar
video.addEventListener("click", () => {
  if (video.paused) {
    video.play();
    music.play();
  }
});

// Pausa no segundo 8
video.addEventListener("timeupdate", () => {
  if (video.currentTime >= 8) {
    video.pause();
  }
});

// ===== POP-UP =====
const popup = document.getElementById("popup");
const close = document.getElementById("popup-close");

// Mostrar pop-up 2s depois de abrir
setTimeout(() => {
  popup.classList.add("active");
}, 2000);

// Fechar pop-up ao clicar no X
close.addEventListener("click", () => {
  popup.classList.remove("active");
});
</script>

</body>
</html>
