<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Convite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  font-family: 'Amatic SC', cursive;
}

/* ===== CONVITE ===== */
#convite {
  width: 100%;
  display: flex;
  justify-content: center;
}

#conteudo {
  width: 100%;
  position: relative;
}

#conteudo img {
  width: 100%;
  display: block;
}

/* ===== CONTAGEM ===== */
#contador {
  position: absolute;
  top: 83%;
  width: 100%;
  text-align: center;
  color: white;
  animation: surgir 1.5s ease forwards;
}

#contador h1 {
  font-size: 56px;
  margin-bottom: 12px;
}

#tempo {
  display: flex;
  justify-content: center;
  gap: 28px;
  font-size: 42px;
}

.bloco span {
  display: block;
  font-size: 64px;
}

@keyframes surgir {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== BOTÕES ===== */
#botoes {
  position: absolute;
  top: 64%;
  left: 62%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 22px;
  width: 85%;
  max-width: 340px;
  z-index: 15;
}

.botao {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: white;
  font-size: 28px;
}

.icone {
  width: 60px;
  height: 60px;
  background: #719aff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.material-icons {
  font-size: 34px;
  color: white;
}

/* ===== POP-UP ===== */
#popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: 0.4s;
  z-index: 30;
}

#popup.active {
  opacity: 1;
  pointer-events: all;
}

#popup-content {
  background: #223052;
  color: white;
  padding: 65px 55px;
  border-radius: 32px;
  text-align: center;
  max-width: 560px;
  width: 92%;
  font-size: 40px;
  line-height: 1.4;
  position: relative;
}

.confirmacao {
  margin-top: 25px;
  font-size: 36px;
}

#popup-close {
  position: absolute;
  top: 6px;
  right: 14px;
  font-size: 72px;
  cursor: pointer;
  line-height: 1;
}

/* ===== MÚSICA ===== */
audio {
  display: none;
}
</style>
</head>

<body>

<div id="convite">
  <div id="conteudo">

    <!-- CONTAGEM -->
    <div id="contador">
      <h1>Rhuana faz 15!</h1>
      <div id="tempo">
        <div class="bloco"><span id="dias">0</span>Dias</div>
        <div class="bloco"><span id="horas">0</span>Horas</div>
        <div class="bloco"><span id="minutos">0</span>Min</div>
        <div class="bloco"><span id="segundos">0</span>Seg</div>
      </div>
    </div>

    <!-- FUNDO -->
    <img src="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/Rhuana_20260212_142427_0000.png">

    <!-- BOTÕES -->
    <div id="botoes">

      <!-- LINK ATUALIZADO AQUI -->
      <a href="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/Rhuana_20260216_143922_0000.png" class="botao">
        <div class="icone"><span class="material-icons">card_giftcard</span></div>
        Sugestões de presentes
      </a>

      <a href="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/paleta%20de%20cores%20rhuana.jpeg" class="botao">
        <div class="icone"><span class="material-icons">checkroom</span></div>
        Dress code
      </a>

      <a href="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/C%C3%B3pia%20de%20Rhuana.png" class="botao">
        <div class="icone"><span class="material-icons">menu_book</span></div>
        Manual do convidado
      </a>

      <a href="https://maps.app.goo.gl/7bjk6MGksNM6erDX8" class="botao">
        <div class="icone"><span class="material-icons">place</span></div>
        Localização
      </a>

    </div>
  </div>
</div>

</body>
</html>
