<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- Título -->
<title>Convite</title>

<!-- Viewport mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.video-container {
  max-width: 100vw;
  max-height: 100vh;
}

video {
  width: auto;
  height: auto;
  max-width: 100vw;
  max-height: 100vh;
  display: block;
  cursor: pointer; /* mostra que é clicável */
}
</style>
</head>

<body>

<div class="video-container">
  <video autoplay muted loop playsinline id="video">
    <source src="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/lv_0_20260211140611.mp4" type="video/mp4">
  </video>
</div>

<script>
// Redireciona para o convite ao clicar no vídeo
document.getElementById("video").addEventListener("click", () => {
  window.location.href = "https://ysmmCF.github.io/ConviteFesta/convite.html";
});
</script>

</body>
</html>
