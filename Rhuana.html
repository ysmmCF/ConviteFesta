<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Convite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonte Amatic SC -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.video-container {
  max-width: 100vw;
  max-height: 100vh;
}

video {
  width: auto;
  height: auto;
  max-width: 100vw;
  max-height: 100vh;
  display: block;
  cursor: pointer;
}

/* TEXTO TOQUE PARA CONTINUAR */
#hintText {
  position: fixed;
  top: 79%; /* altura 98% da parte de baixo é 2% do topo */
  width: 100%;
  text-align: center;
  font-family: 'Amatic SC', cursive;
  font-size: 40px;
  color: white;
  letter-spacing: 2px;
  z-index: 15;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="video-container">
  <video autoplay muted loop playsinline id="video">
    <source src="https://raw.githubusercontent.com/ysmmCF/ConviteFesta/main/lv_0_20260211140611.mp4" type="video/mp4">
  </video>
</div>

<!-- TEXTO TOQUE -->
<div id="hintText">toque para continuar</div>

<script>
// Clique no vídeo leva para o convite
document.getElementById("video").addEventListener("click", () => {
  window.location.href = "https://ysmmCF.github.io/ConviteFesta/convite.html";
});
</script>

</body>
</html>
