<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de Presença</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Amatic SC', cursive;
    background: #f7f7f7;
    padding: 20px;
  }
  .container {
    background: #fff;
    max-width: 400px;
    margin: 40px auto;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
  }
  h2 {
    font-size: 2.2em;
    margin-bottom: 20px;
  }
  label {
    font-size: 1.5em;
    display: block;
    margin-top: 15px;
    text-align: left;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 1.4em;
    margin-top: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }
  .radios label {
    display: flex;
    align-items: center;
    margin-top: 10px;
    font-size: 1.5em;
  }
  .radios input {
    margin-right: 10px;
    transform: scale(1.2);
  }
  button {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    font-size: 1.5em;
    background-color: #6a0dad;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }
  button:hover {
    background-color: #4b006f;
  }
  #msg {
    margin-top: 15px;
    font-size: 1.3em;
    color: green;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Confirmação de Presença</h2>
    <form action="https://script.google.com/macros/s/AKfycbxvbu7Z7tsplWyNLzhuQkX4rsSKU_YlRAazZvIU-cDKUFJRsFn6t752XWEkR1kwzf3s/exec" method="POST" target="hidden_iframe" onsubmit="submitted()">
      <label>Seu nome:</label>
      <input type="text" name="nome" placeholder="Digite seu nome" required>

      <div class="radios">
        <label><input type="radio" name="presenca" value="Sim, estarei lá!" required> Sim, estarei lá!</label>
        <label><input type="radio" name="presenca" value="Não poderei participar" required> Não poderei participar.</label>
      </div>

      <button type="submit">Enviar</button>
    </form>
    <iframe name="hidden_iframe" style="display:none;"></iframe>
    <p id="msg"></p>
  </div>

<script>
function submitted() {
  document.getElementById('msg').innerText = "Sua resposta foi enviada com sucesso!";
}
</script>
</body>
</html>
