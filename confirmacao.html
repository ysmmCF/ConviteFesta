<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de Presença</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; font-family:'Amatic SC', cursive; display:flex; justify-content:center; align-items:center; background: #f9f5ff; }
  .container { width:95%; max-width:500px; background:#fff; border-radius:25px; padding:40px 30px; text-align:center; box-shadow:0 15px 30px rgba(0,0,0,0.2); }
  h2 { color:#6a0dad; font-size:3em; margin-bottom:30px; }
  label { display:block; margin:15px 0 5px; font-size:2em; color:#6a0dad; }
  input[type="text"] { width:100%; padding:15px; font-size:1.5em; border-radius:10px; border:1px solid #ccc; }
  .radios { margin-top:25px; }
  .radios label { display:block; font-size:1.5em; background:#ffd996; color:#6a0dad; padding:15px; border-radius:15px; margin:10px 0; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.2); transition: transform 0.2s; }
  .radios input { display:none; }
  .radios input:checked + span { border:3px solid #4b006f; border-radius:15px; padding:15px; }
  button { margin-top:30px; padding:15px 0; width:100%; font-size:1.8em; border:none; border-radius:25px; background:#ffd996; color:#6a0dad; cursor:pointer; box-shadow:0 6px 12px rgba(0,0,0,0.25); transition: transform 0.2s; }
  button:active { transform:scale(0.97); }
  #msg { margin-top:20px; font-size:1.6em; color:#4b006f; }
  .spark { position:absolute; width:6px; height:6px; background:#c188ff; border-radius:50%; animation:sparkle 0.8s forwards; pointer-events:none; opacity:0.9; }
  @keyframes sparkle { 0% { opacity:1; transform:translate(0,0) scale(1); } 100% { opacity:0; transform:translate(var(--x), var(--y)) scale(0.3); } }
</style>
</head>
<body>
<div class="container">
  <h2>Confirmação de Presença</h2>
  <form id="form">
    <label>Seu nome:</label>
    <input type="text" name="nome" placeholder="Digite seu nome" required>
    <div class="radios">
      <label><input type="radio" name="presenca" value="Sim, estarei lá!" required><span>Sim, estarei lá!</span></label>
      <label><input type="radio" name="presenca" value="Não poderei participar" required><span>Não poderei participar.</span></label>
    </div>
    <button type="submit">Enviar</button>
  </form>
  <p id="msg"></p>
</div>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const webAppUrl = "https://script.google.com/macros/s/AKfycbx3DvKzsaCp6SsYynqIjaZzqpI4reIo40fc_soDczlO0VAC3Q1rtDYlHiwtVXYMGxTN/exec";

form.addEventListener('submit', e => {
  e.preventDefault();

  // Animação de brilhos
  for(let i=0;i<8;i++){
    const spark = document.createElement('div');
    spark.className = 'spark';
    const x = (Math.random()-0.5)*80 + 'px';
    const y = (Math.random()-0.5)*80 + 'px';
    spark.style.setProperty('--x', x);
    spark.style.setProperty('--y', y);
    spark.style.left = '50%';
    spark.style.top = '50%';
    form.appendChild(spark);
    setTimeout(()=>spark.remove(),800);
  }

  // Enviar dados como FormData
  const formData = new FormData(form);
  fetch(webAppUrl, { method:'POST', body: formData })
    .then(res => res.text())
    .then(() => {
      msg.innerText = "Sua resposta foi enviada com sucesso!";
      form.reset();
    })
    .catch(() => {
      msg.innerText = "Ocorreu um erro ao enviar. Tente novamente.";
      msg.style.color = "red";
    });
});
</script>
</body>
</html>
