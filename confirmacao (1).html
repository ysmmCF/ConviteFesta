<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de Presença</title>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Amatic SC', cursive;
      background: #f7f7f7;
      padding: 20px;
    }
    .container {
      background: #fff;
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.2em;
    }
    label {
      font-size: 1.5em;
      margin-top: 15px;
      display: block;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1.4em;
    }
    .radios {
      margin-top: 20px;
    }
    .radios label {
      font-size: 1.5em;
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .radios input {
      margin-right: 10px;
      transform: scale(1.2);
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      font-size: 1.5em;
      background-color: #6a0dad;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover {
      background-color: #4b006f;
    }
    .status {
      margin-top: 15px;
      font-size: 1.2em;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Confirmação de Presença</h2>
    <label>Seu nome:</label>
    <input type="text" id="name" placeholder="Digite seu nome" />

    <div class="radios">
      <label><input type="radio" name="presence" value="sim"> Sim, estarei lá!</label>
      <label><input type="radio" name="presence" value="nao"> Não poderei participar.</label>
    </div>

    <button id="send">Enviar</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    (function() {
      const webAppUrl = "https://script.google.com/macros/s/AKfycbzH_WrjU7xgdToVqbzll2VPmMsuPQUlbYuoa9zOyxHxpXgO9KA9tgMtL92f_VZ0QCbM/exec";
      const sendBtn = document.getElementById('send');
      const statusDiv = document.getElementById('status');

      sendBtn.addEventListener('click', () => {
        const name = document.getElementById('name').value.trim();
        const presenceEle = document.querySelector('input[name="presence"]:checked');
        const presence = presenceEle ? presenceEle.value : "";

        if (!name) {
          alert("Por favor, digite seu nome.");
          return;
        }
        if (!presence) {
          alert("Por favor, selecione uma das opções: Sim ou Não.");
          return;
        }

        // Preparar como urlencoded para evitar complicações CORS
        const params = new URLSearchParams();
        params.append('nome', name);
        params.append('presenca', presence);

        sendBtn.disabled = true;
        statusDiv.textContent = "Enviando...";

        fetch(webAppUrl, {
          method: "POST",
          body: params
        })
        .then(response => {
          // podemos não conseguir ler JSON dependendo de cabeçalhos CORS, mas esperamos que tenha sido enviado
          statusDiv.textContent = "Enviado com sucesso!";
          // Limpar
          document.getElementById('name').value = "";
          Array.from(document.querySelectorAll('input[name="presence"]')).forEach(r => r.checked = false);
          sendBtn.disabled = false;
        })
        .catch(error => {
          console.error("Erro ao enviar:", error);
          statusDiv.textContent = "Erro ao enviar. Tente novamente.";
          sendBtn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
